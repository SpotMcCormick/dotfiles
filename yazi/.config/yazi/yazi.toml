[opener]
edit = [
    { run = 'nvim %s', block = true, desc = "Neovim" },
]

csv = [
    { run = 'libreoffice --calc %s', orphan = true, desc = "LibreOffice Calc" },
]

open = [
    { run = 'xdg-open %s1', orphan = true, desc = "Open", for = "linux" },
]

[open]
prepend_rules = [
    { url = "*.csv", use = "csv" },
    { mime = "text/*", use = "edit" },
    { mime = "application/pdf", use = "open" },
]
